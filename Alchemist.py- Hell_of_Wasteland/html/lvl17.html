<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCHEMIST.PY — Level 17: The Wizard's Riddle</title>
    <meta name="description" content="Level 17 of Alchemist.py - Back at the wizard shop, solve the riddle to get the map to the Castle of Heartwood Sapphire!">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/lvl17.css">
    <link rel="stylesheet" href="../css/helpbox.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>

    <!-- PARTICLE EFFECT CANVAS -->
    <canvas id="spell-particles"></canvas>

    <!-- SHOP BACKGROUND -->
    <div id="room-bg"></div>

    <!-- RIDDLE HUD -->
    <div id="riddle-hud">
        <div id="riddle-label">🧩 WIZARD'S RIDDLE</div>
        <div id="riddle-hint">GUESS THE AGE</div>
        <div id="riddle-status">🔮 UNSOLVED</div>
    </div>

    <!-- THE CAT SPRITE -->
    <div id="the-cat-lvl17"></div>

    <!-- DIALOGUE BOX (Cat) -->
    <div class="dialogue-box-lvl17" id="dialogue-box">
        <div class="speaker-name-lvl17" id="speaker-label">The Cat</div>
        <div id="typewriter-text-lvl17"></div>
    </div>

    <!-- WIZARD SPEECH CLOUD -->
    <div id="wizard-bubble" class="wizard-bubble">
        <div id="wizard-bubble-text"></div>
        <div class="wizard-bubble-tail"></div>
    </div>

    <!-- GRIMOIRE OVERLAY (Code Editor) -->
    <div id="grimoire-overlay">
        <div id="grimoire-container">
            <div id="grimoire-header">
                <span id="grimoire-title">🧩 RIDDLE SOLVER SPELL</span>
                <button id="grimoire-close" title="Close">✕</button>
            </div>
            <div id="spell-task">
                <span id="spell-task-label">TASK:</span>
                <span id="spell-task-text">Loading...</span>
            </div>
            <div id="code-editor-area">
                <div id="line-numbers"></div>
                <textarea id="code-input" spellcheck="false" autocomplete="off"
                    placeholder="# Write your Python code here..."></textarea>
            </div>
            <div id="output-console">
                <div id="output-label">>>> OUTPUT</div>
                <div id="output-text"></div>
            </div>
            <div id="grimoire-actions">
                <button id="btn-cast-spell">⚡ SOLVE THE RIDDLE</button>
                <button id="btn-clear">🗑 CLEAR</button>
            </div>
        </div>
    </div>

    <!-- SUCCESS SCREEN -->
    <div id="success-screen">
        <div id="success-content">
            <div id="success-icon">🗺️</div>
            <h1 id="success-title">RIDDLE SOLVED!</h1>
            <p id="success-subtitle">The wizard is impressed! He hands you the map to the Castle of Heartwood Sapphire where a Fragment of the Crystal Compiler awaits!</p>
            <div id="success-stats"></div>
            <button id="btn-continue">CONTINUE THE JOURNEY →</button>
        </div>
    </div>

    <script src="../js/engine.js"></script>
    <script src="../js/helpbox.js"></script>
    <script src="../js/lvl17.js"></script>
    <script>createHelpBox(17);</script>
</body>
</html>
