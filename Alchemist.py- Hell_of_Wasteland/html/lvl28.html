<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCHEMIST.PY — Level 28: Lucifer's Castle</title>
    <meta name="description" content="Level 28 of Alchemist.py - Defeat the Demon King Lucifer by printing a hollow diamond pattern inside a square matrix!">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/lvl28.css">
    <link rel="stylesheet" href="../css/helpbox.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>

    <!-- PARTICLE EFFECT CANVAS -->
    <canvas id="spell-particles"></canvas>

    <!-- BACKGROUND -->
    <div id="room-bg"></div>

    <!-- CASTLE HUD -->
    <div id="castle-hud">
        <div id="castle-label">🏰 LUCIFER'S CASTLE</div>
        <div id="castle-info">FRAGMENT: LOCKED | GUARDIAN: LUCIFER</div>
        <div id="castle-status">⚔️ GUARDED</div>
    </div>

    <!-- THE CAT SPRITE (right side) -->
    <div id="the-cat-lvl28"></div>

    <!-- THE UNICORN SPRITE (left side) -->
    <div id="the-unicorn-lvl28"></div>

    <!-- DIALOGUE BOX (Cat — bottom center) -->
    <div class="dialogue-box-cat" id="dialogue-box-cat">
        <div class="speaker-name-cat">The Cat</div>
        <div id="typewriter-text-cat"></div>
    </div>

    <!-- DIALOGUE BOX (Unicorn — bottom center, lavender theme) -->
    <div class="dialogue-box-unicorn" id="dialogue-box-unicorn">
        <div class="speaker-name-unicorn">Lumina</div>
        <div id="typewriter-text-unicorn"></div>
    </div>

    <!-- GRIMOIRE OVERLAY (Code Editor) -->
    <div id="grimoire-overlay">
        <div id="grimoire-container">
            <div id="grimoire-header">
                <span id="grimoire-title">⚔️ DEMON KING SPELL</span>
                <button id="grimoire-close" title="Close">✕</button>
            </div>
            <div id="spell-task">
                <span id="spell-task-label">TASK:</span>
                <span id="spell-task-text">Loading...</span>
            </div>
            <div id="code-editor-area">
                <div id="line-numbers"></div>
                <textarea id="code-input" spellcheck="false" autocomplete="off"
                    placeholder="# Write your Python code here..."></textarea>
            </div>
            <div id="output-console">
                <div id="output-label">>>> OUTPUT</div>
                <div id="output-text"></div>
            </div>
            <div id="grimoire-actions">
                <button id="btn-cast-spell">⚡ CAST THE SPELL</button>
                <button id="btn-clear">🗑 CLEAR</button>
            </div>
        </div>
    </div>

    <!-- SUCCESS SCREEN -->
    <div id="success-screen">
        <div id="success-content">
            <div id="success-icon">👑</div>
            <h1 id="success-title">LUCIFER DEFEATED!</h1>
            <p id="success-subtitle">The demon king falls! The hollow diamond spell shatters Lucifer's defences. The 2nd Crystal Fragment glows with dark energy as you claim it!</p>
            <div id="success-stats"></div>
            <button id="btn-continue">CLAIM THE FRAGMENT →</button>
        </div>
    </div>

    <script src="../js/engine.js"></script>
    <script src="../js/helpbox.js"></script>
    <script src="../js/lvl28.js"></script>
    <script>createHelpBox(28);</script>
</body>
</html>
