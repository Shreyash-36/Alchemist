<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCHEMIST.PY — Level 2: The Broken Floor</title>
    <meta name="description" content="Level 2 of Alchemist.py - The cat enters the mansion and finds the floor broken. Write Python code to sum 3 numbers to 100 planks and fix it!">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/lvl2.css?v=loading1">
    <link rel="stylesheet" href="../css/helpbox.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>

    <!-- PARTICLE EFFECT CANVAS -->
    <canvas id="spell-particles"></canvas>

    <!-- ROOM BACKGROUND -->
    <div id="room-bg"></div>

    <!-- PLANK HUD -->
    <div id="plank-hud">
        <div id="plank-label">🪵 PLANKS NEEDED</div>
        <div id="plank-count">0 / 100</div>
        <div id="plank-bar-track">
            <div id="plank-bar-fill"></div>
        </div>
    </div>

    <!-- THE CAT SPRITE -->
    <div id="the-cat-lvl2"></div>

    <!-- DIALOGUE BOX -->
    <div class="dialogue-box-lvl2" id="dialogue-box">
        <div class="speaker-name-lvl2">The Cat</div>
        <div id="typewriter-text-lvl2"></div>
    </div>

    <!-- GRIMOIRE OVERLAY (Code Editor) -->
    <div id="grimoire-overlay">
        <div id="grimoire-container">
            <div id="grimoire-header">
                <span id="grimoire-title">📜 FLOOR REPAIR SPELL</span>
                <button id="grimoire-close" title="Close">✕</button>
            </div>
            <div id="spell-task">
                <span id="spell-task-label">TASK:</span>
                <span id="spell-task-text">Loading...</span>
            </div>
            <div id="code-editor-area">
                <div id="line-numbers"></div>
                <textarea id="code-input" spellcheck="false" autocomplete="off"
                    placeholder="# Write your Python code here..."></textarea>
            </div>
            <div id="output-console">
                <div id="output-label">>>> OUTPUT</div>
                <div id="output-text"></div>
            </div>
            <div id="grimoire-actions">
                <button id="btn-cast-spell">⚡ CAST REPAIR SPELL</button>
                <button id="btn-clear">🗑 CLEAR</button>
            </div>
        </div>
    </div>

    <!-- SUCCESS SCREEN -->
    <div id="success-screen">
        <div id="success-content">
            <div id="success-icon">🪵</div>
            <h1 id="success-title">FLOOR REPAIRED!</h1>
            <p id="success-subtitle">Your summation spell provided exactly 100 planks. The floor is whole again!</p>
            <div id="success-stats"></div>
            <button id="btn-continue">CONTINUE THE JOURNEY →</button>
        </div>
    </div>

    <script src="../js/engine.js?v=loading1"></script>
    <script src="../js/helpbox.js"></script>
    <script src="../js/lvl2.js?v=loading1"></script>
    <script>createHelpBox(2);</script>
</body>
</html>
