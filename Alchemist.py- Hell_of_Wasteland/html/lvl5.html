<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCHEMIST.PY — Level 5: The Numbered Staircase</title>
    <meta name="description" content="Level 5 of Alchemist.py - Climb the staircase by checking if numbers are positive, negative, or zero using Python.">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/lvl5.css?v=loading1">
    <link rel="stylesheet" href="../css/helpbox.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>

    <!-- PARTICLE CANVAS -->
    <canvas id="spell-particles"></canvas>

    <!-- STAIRCASE BACKGROUND -->
    <div id="staircase-bg"></div>

    <!-- STEP PROGRESS HUD -->
    <div id="step-hud">
        <div id="step-hud-label">🪜 STAIR PROGRESS</div>
        <div id="step-bar-track">
            <div id="step-bar-fill"></div>
        </div>
        <div id="step-percent">0%</div>
    </div>

    <!-- STAIR NUMBER HUD -->
    <div id="stair-hud">
        <div id="stair-hud-label">🔢 STAIR STATUS</div>
        <div id="stair-slots"></div>
    </div>

    <!-- THE CAT SPRITE -->
    <div id="the-cat-lvl5"></div>

    <!-- DIALOGUE BOX -->
    <div class="dialogue-box-lvl5" id="dialogue-box">
        <div class="speaker-name-lvl5">The Cat</div>
        <div id="typewriter-text-lvl5"></div>
    </div>

    <!-- GRIMOIRE OVERLAY (Code Editor) -->
    <div id="grimoire-overlay">
        <div id="grimoire-container">
            <div id="grimoire-header">
                <span id="grimoire-title">📜 STAIRCASE CODEX</span>
                <button id="grimoire-close" title="Close">✕</button>
            </div>
            <div id="spell-task">
                <span id="spell-task-label">TASK:</span>
                <span id="spell-task-text">Loading...</span>
            </div>
            <div id="code-editor-area">
                <div id="line-numbers"></div>
                <textarea id="code-input" spellcheck="false" autocomplete="off"
                    placeholder="# Write your Python code here..."></textarea>
            </div>
            <div id="output-console">
                <div id="output-label">>>> OUTPUT</div>
                <div id="output-text"></div>
            </div>
            <div id="grimoire-actions">
                <button id="btn-cast-spell">⚡ CLIMB STAIR</button>
                <button id="btn-clear">🗑 CLEAR</button>
            </div>
        </div>
    </div>

    <!-- SUCCESS SCREEN -->
    <div id="success-screen">
        <div id="success-content">
            <div id="success-icon">🪜</div>
            <h1 id="success-title">THE STAIRCASE IS CONQUERED!</h1>
            <p id="success-subtitle">You identified every number correctly and reached the top.</p>
            <div id="success-stats"></div>
            <button id="btn-continue">CONTINUE THE JOURNEY →</button>
        </div>
    </div>

    <script src="../js/engine.js?v=loading1"></script>
    <script src="../js/helpbox.js"></script>
    <script src="../js/lvl5.js?v=loading1"></script>
    <script>createHelpBox(5);</script>
</body>
</html>
