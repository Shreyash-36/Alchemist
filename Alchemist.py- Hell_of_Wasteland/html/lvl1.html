<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCHEMIST.PY</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css?v=loading1">
    <link rel="stylesheet" href="../css/helpbox.css">

    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <script src="../js/engine.js?v=loading1" defer></script>
    <script src="../js/helpbox.js" defer></script>
    <script src="../js/lvl1.js?v=loading1" defer></script>

</head>

<body>

    <div id="loading-screen" style="display: flex;">
        <div class="loading-content">
            <p id="loading-message">Transmuting lead into gold...</p>
            <div class="spinner"></div>
        </div>
    </div>

    <div id="game-ui" style="display: none;">

        <div id="the-cat"></div>

        <!-- GRIMOIRE OVERLAY (Code Editor) -->
        <div id="grimoire-overlay">
            <div id="grimoire-container">
                <div id="grimoire-header">
                    <span id="grimoire-title">📜 ALCHEMIST'S RIDDLE</span>
                    <button id="grimoire-close" title="Close Grimoire">✕</button>
                </div>

                <!-- Riddle / Task Display -->
                <div id="spell-task">
                    <span id="spell-task-label">RIDDLE:</span>
                    <span id="spell-task-text">Loading...</span>
                </div>

                <!-- Code Editor Area -->
                <div id="code-editor-area">
                    <div id="line-numbers"></div>
                    <textarea id="code-input" spellcheck="false" autocomplete="off"
                        placeholder="# Write your Python code here..."></textarea>
                </div>

                <!-- Output Console -->
                <div id="output-console">
                    <div id="output-label">>>> OUTPUT</div>
                    <div id="output-text"></div>
                </div>

                <!-- Action Buttons -->
                <div id="grimoire-actions">
                    <button id="btn-cast-spell">⚡ RUN CODE</button>
                    <button id="btn-clear">🗑 CLEAR</button>
                </div>
            </div>
        </div>

        <div class="dialogue-box">
            <div class="speaker-name">The Cat</div>
            <div id="typewriter-text"></div>
        </div>

    </div>


    <script>createHelpBox(1);</script>
</body>

</html>
