<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCHEMIST.PY — Level 15: The Dragon Battle</title>
    <meta name="description" content="Level 15 of Alchemist.py - The dragon wakes up! Cast a star pattern spell to defeat it and escape the cave!">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/lvl15.css">
    <link rel="stylesheet" href="../css/helpbox.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>

    <!-- PARTICLE EFFECT CANVAS -->
    <canvas id="spell-particles"></canvas>

    <!-- CAVE BACKGROUND (switches from battle to defeated) -->
    <div id="room-bg"></div>
    <div id="room-bg-victory"></div>

    <!-- BATTLE HUD -->
    <div id="battle-hud">
        <div id="battle-label">🐉 DRAGON BATTLE</div>
        <div id="battle-rows"></div>
        <div id="battle-status">⚔️ FIGHTING</div>
    </div>

    <!-- THE CAT SPRITE -->
    <div id="the-cat-lvl15"></div>

    <!-- DIALOGUE BOX -->
    <div class="dialogue-box-lvl15" id="dialogue-box">
        <div class="speaker-name-lvl15">The Cat</div>
        <div id="typewriter-text-lvl15"></div>
    </div>

    <!-- GRIMOIRE OVERLAY (Code Editor) -->
    <div id="grimoire-overlay">
        <div id="grimoire-container">
            <div id="grimoire-header">
                <span id="grimoire-title">⭐ STAR PATTERN SPELL</span>
                <button id="grimoire-close" title="Close">✕</button>
            </div>
            <div id="spell-task">
                <span id="spell-task-label">TASK:</span>
                <span id="spell-task-text">Loading...</span>
            </div>
            <div id="code-editor-area">
                <div id="line-numbers"></div>
                <textarea id="code-input" spellcheck="false" autocomplete="off"
                    placeholder="# Write your Python code here..."></textarea>
            </div>
            <div id="output-console">
                <div id="output-label">>>> OUTPUT</div>
                <div id="output-text"></div>
            </div>
            <div id="grimoire-actions">
                <button id="btn-cast-spell">⚡ CAST STAR SPELL</button>
                <button id="btn-clear">🗑 CLEAR</button>
            </div>
        </div>
    </div>

    <!-- SUCCESS SCREEN -->
    <div id="success-screen">
        <div id="success-content">
            <div id="success-icon">⭐</div>
            <h1 id="success-title">DRAGON DEFEATED!</h1>
            <p id="success-subtitle">The star spell hits the dragon and it collapses back onto the treasure! Time to escape with the coins!</p>
            <div id="success-stats"></div>
            <button id="btn-continue">CONTINUE THE JOURNEY →</button>
        </div>
    </div>

    <script src="../js/engine.js"></script>
    <script src="../js/helpbox.js"></script>
    <script src="../js/lvl15.js"></script>
    <script>createHelpBox(15);</script>
</body>
</html>
