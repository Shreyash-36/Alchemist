<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCHEMIST.PY — Level Map II</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Press Start 2P', cursive;
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 30%, #0a1f2a 0%, #04100e 50%, #000800 100%);
            color: #00ffc8;
            overflow-x: hidden;
        }

        /* ── HEADER ── */
        .map-header {
            text-align: center;
            padding: 36px 20px 10px;
        }
        .map-title {
            font-size: 20px;
            color: #00ffc8;
            text-shadow: 0 0 20px rgba(0, 255, 200, 0.5), 3px 3px 0 #000;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .map-subtitle {
            font-size: 8px;
            color: #0a9678;
            letter-spacing: 1px;
        }

        /* ── LEVEL GRID ── */
        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            max-width: 900px;
            margin: 36px auto;
            padding: 0 24px;
        }

        /* ── LEVEL CARD ── */
        .level-card {
            background: rgba(10, 30, 26, 0.8);
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px 12px;
            text-align: center;
            cursor: default;
            transition: all 0.3s ease;
            position: relative;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Locked card */
        .level-card.locked {
            opacity: 0.45;
        }
        .level-card.locked .lock-icon {
            font-size: 28px;
            margin-bottom: 4px;
            filter: grayscale(0.5);
        }
        .level-card.locked .card-title,
        .level-card.locked .card-subtitle,
        .level-card.locked .card-concept {
            color: #555;
        }

        /* Unlocked (current) card */
        .level-card.unlocked {
            border-color: #00ffc8;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.25), inset 0 0 15px rgba(0, 255, 200, 0.05);
            cursor: pointer;
            animation: card-glow 2.5s ease-in-out infinite;
        }
        .level-card.unlocked:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.45), inset 0 0 20px rgba(0, 255, 200, 0.1);
            border-color: #b0ffe8;
        }

        @keyframes card-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 200, 0.25), inset 0 0 15px rgba(0, 255, 200, 0.05); }
            50% { box-shadow: 0 0 28px rgba(0, 255, 200, 0.4), inset 0 0 20px rgba(0, 255, 200, 0.08); }
        }

        /* Completed card */
        .level-card.completed {
            border-color: #4ade80;
            opacity: 0.85;
            cursor: pointer;
        }
        .level-card.completed:hover {
            opacity: 1;
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
        }
        .level-card.completed .card-check {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 12px;
        }

        /* Card elements */
        .card-icon {
            font-size: 28px;
            margin-bottom: 2px;
        }
        .card-title {
            font-size: 9px;
            color: #00ffc8;
            margin-bottom: 2px;
        }
        .card-subtitle {
            font-size: 6px;
            color: #0a9678;
            line-height: 1.6;
        }
        .card-concept {
            font-size: 6px;
            color: #4ade80;
            margin-top: 2px;
        }

        /* ── FOOTER BAR ── */
        .map-footer {
            text-align: center;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .progress-text {
            font-size: 9px;
            color: #0a9678;
        }
        .progress-text span {
            color: #00ffc8;
        }
        .reset-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 7px;
            color: #ff6b6b;
            background: rgba(255, 100, 100, 0.1);
            border: 2px solid rgba(255, 100, 100, 0.35);
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .reset-btn:hover {
            background: rgba(255, 100, 100, 0.25);
            border-color: #ff6b6b;
        }

        /* ── CHAPTER 1 BUTTON ── */
        .chapter1-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 7px;
            color: #FFD700;
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .chapter1-btn:hover {
            background: rgba(255, 215, 0, 0.25);
            border-color: #FFD700;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.35);
            transform: translateY(-2px);
        }

        /* ── CHAPTER 3 BUTTON ── */
        .chapter3-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 7px;
            color: #fb923c;
            background: rgba(251, 146, 60, 0.1);
            border: 2px solid rgba(251, 146, 60, 0.4);
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }
        .chapter3-btn.visible {
            display: inline-block;
        }
        .chapter3-btn:hover {
            background: rgba(251, 146, 60, 0.25);
            border-color: #fb923c;
            box-shadow: 0 0 18px rgba(251, 146, 60, 0.35);
            transform: translateY(-2px);
        }

        /* ── VIDEO OVERLAY ── */
        .video-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .video-overlay.active {
            display: flex;
            opacity: 1;
        }
        .video-overlay video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .video-skip-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 7px;
            color: #aaa;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100000;
        }
        .video-skip-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
        }
        .video-continue-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            color: #fb923c;
            background: rgba(251, 146, 60, 0.12);
            border: 3px solid #fb923c;
            border-radius: 10px;
            padding: 20px 36px;
            cursor: pointer;
            z-index: 100000;
            display: none;
            opacity: 0;
            transition: all 0.4s ease;
            text-shadow: 0 0 12px rgba(251, 146, 60, 0.5);
            animation: continue-pulse 2s ease-in-out infinite;
        }
        .video-continue-btn.visible {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .video-continue-btn:hover {
            background: rgba(251, 146, 60, 0.25);
            box-shadow: 0 0 30px rgba(251, 146, 60, 0.5);
            transform: translate(-50%, -50%) scale(1.05);
        }
        @keyframes continue-pulse {
            0%, 100% { box-shadow: 0 0 15px rgba(251, 146, 60, 0.2); }
            50% { box-shadow: 0 0 30px rgba(251, 146, 60, 0.45); }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 700px) {
            .level-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
            .map-title { font-size: 14px; }
            .level-card { min-height: 110px; padding: 14px 8px; }
            .card-icon, .lock-icon { font-size: 22px; }
            .card-title { font-size: 7px; }
        }
        @media (max-width: 420px) {
            .level-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="map-header">
        <div class="map-title">🌳 ALCHEMIST'S MAP II 🌳</div>
        <div class="map-subtitle">THE CASTLE OF HEARTWOOD SAPPHIRE</div>
    </div>

    <div class="level-grid" id="level-grid"></div>

    <div class="map-footer">
        <div class="progress-text">LEVELS COMPLETED: <span id="completed-count">0</span> / 10</div>
        <button class="reset-btn" id="reset-btn">🔒 RESET</button>
        <button class="chapter3-btn" id="chapter3-btn">🗺️ CHAPTER 3 →</button>
        <button class="chapter1-btn" id="chapter1-btn">🗺️ CHAPTER 1</button>
    </div>

    <!-- CHAPTER 3 INTRO VIDEO OVERLAY -->
    <div class="video-overlay" id="ch3-video-overlay">
        <video id="ch3-intro-video" playsinline>
            <source src="../assets/Level20/Video Project 6.mp4" type="video/mp4">
        </video>
        <button class="video-skip-btn" id="ch3-skip-btn">SKIP ▶▶</button>
        <button class="video-continue-btn" id="ch3-continue-btn">ENTER CHAPTER 3 →</button>
    </div>

<script>
    var LEVELS = [
        { num: 11, title: "Level 11", name: "The bewilder Trees",       icon: "🌿", concept: "Reverse String" },
        { num: 12, title: "Level 12", name: "The food problem again",   icon: "📜", concept: "String Methods" },
        { num: 13, title: "Level 13", name: "Such a big STONE!!",       icon: "🔒", concept: "while Loop" },
        { num: 14, title: "Level 14", name: "The Rich Dragon",          icon: "🪙", concept: "Nested if-else" },
        { num: 15, title: "Level 15", name: "Time to FIGHT!",           icon: "🐉", concept: "Nested Loops" },
        { num: 16, title: "Level 16", name: "RUNNNNN!!!",               icon: "🏃", concept: "String Methods" },
        { num: 17, title: "Level 17", name: "The Wizi again",           icon: "♾️", concept: "Nested if-else and Loops" },
        { num: 18, title: "Level 18", name: "The River of Arrays",      icon: "🌊", concept: "Arrays" },
        { num: 19, title: "Level 19", name: "The Broken Ladders",       icon: "🔨", concept: "Array Methods" },
        { num: 20, title: "Level 20", name: "The Final Choice",         icon: "💎", concept: "Classes & Objects" }
    ];

    // ── PROGRESS (separate key for Chapter 2) ──
    var STORAGE_KEY = "alchemist_progress_ch2";

    function getProgress() {
        try {
            var saved = localStorage.getItem(STORAGE_KEY);
            if (saved) return JSON.parse(saved);
        } catch (e) {}
        return { completed: [] };
    }

    function saveProgress(progress) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    }

    function isCompleted(levelNum) {
        return getProgress().completed.indexOf(levelNum) !== -1;
    }

    function isUnlocked(levelNum) {
        if (levelNum === 11) return true;
        return isCompleted(levelNum - 1);
    }

    function renderGrid() {
        var grid = document.getElementById("level-grid");
        var progress = getProgress();
        var completedCount = progress.completed.length;

        grid.innerHTML = "";

        for (var i = 0; i < LEVELS.length; i++) {
            var lvl = LEVELS[i];
            var completed = isCompleted(lvl.num);
            var unlocked = isUnlocked(lvl.num);

            var card = document.createElement("div");
            card.className = "level-card";

            if (completed) {
                card.classList.add("completed");
                card.innerHTML =
                    '<span class="card-check">✅</span>' +
                    '<span class="card-icon">' + lvl.icon + '</span>' +
                    '<div class="card-title">' + lvl.title.toUpperCase() + '</div>' +
                    '<div class="card-subtitle">' + lvl.name + '</div>' +
                    '<div class="card-concept">' + lvl.concept + '</div>';
                card.dataset.level = lvl.num;
                card.addEventListener("click", function () {
                    var num = this.dataset.level;
                    window.location.href = "lvl" + num + ".html";
                });
            } else if (unlocked) {
                card.classList.add("unlocked");
                card.innerHTML =
                    '<span class="card-icon">' + lvl.icon + '</span>' +
                    '<div class="card-title">' + lvl.title.toUpperCase() + '</div>' +
                    '<div class="card-subtitle">' + lvl.name + '</div>' +
                    '<div class="card-concept">' + lvl.concept + '</div>';
                card.dataset.level = lvl.num;
                card.addEventListener("click", function () {
                    var num = this.dataset.level;
                    window.location.href = "lvl" + num + ".html";
                });
            } else {
                card.classList.add("locked");
                card.innerHTML =
                    '<span class="lock-icon">🔒</span>' +
                    '<div class="card-title">' + lvl.title.toUpperCase() + '</div>' +
                    '<div class="card-subtitle">' + lvl.name + '</div>' +
                    '<div class="card-concept">' + lvl.concept + '</div>';
            }

            grid.appendChild(card);
        }

        document.getElementById("completed-count").textContent = completedCount;
    }

    // Reset button (only resets Chapter 2 progress)
    document.getElementById("reset-btn").addEventListener("click", function () {
        if (confirm("Reset Chapter 2 progress? This will lock all levels except Level 11.")) {
            localStorage.removeItem(STORAGE_KEY);
            renderGrid();
        }
    });

    // Chapter 1 button
    document.getElementById("chapter1-btn").addEventListener("click", function () {
        window.open("map.html", "_blank");
    });

    // Chapter 3 button — only visible when level 20 is completed
    var ch3Btn = document.getElementById("chapter3-btn");
    var ch3Overlay = document.getElementById("ch3-video-overlay");
    var ch3Video = document.getElementById("ch3-intro-video");
    var ch3Skip = document.getElementById("ch3-skip-btn");
    var ch3Continue = document.getElementById("ch3-continue-btn");

    function showCh3ContinueButton() {
        ch3Video.pause();
        ch3Video.style.opacity = '0.3';
        ch3Skip.style.display = 'none';
        ch3Continue.classList.add("visible");
    }

    function openChapter3() {
        ch3Overlay.classList.remove("active");
        ch3Video.style.opacity = '1';
        ch3Continue.classList.remove("visible");
        ch3Skip.style.display = '';
        window.open("map3.html", "_blank");
    }

    ch3Btn.addEventListener("click", function () {
        ch3Overlay.classList.add("active");
        ch3Video.currentTime = 0;
        ch3Video.style.opacity = '1';
        ch3Continue.classList.remove("visible");
        ch3Skip.style.display = '';
        ch3Video.play();
    });

    ch3Video.addEventListener("ended", showCh3ContinueButton);
    ch3Skip.addEventListener("click", showCh3ContinueButton);
    ch3Continue.addEventListener("click", openChapter3);

    function updateChapter3Button() {
        if (isCompleted(20)) {
            ch3Btn.classList.add("visible");
        } else {
            ch3Btn.classList.remove("visible");
        }
    }

    // Render on load
    renderGrid();
    updateChapter3Button();
</script>

</body>
</html>
