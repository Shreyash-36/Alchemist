<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCHEMIST.PY — Level 3: The Lever Gate</title>
    <meta name="description" content="Level 3 of Alchemist.py - The cat finds a gate with 6 levers. Write Python code to check odd and even numbers to flip the even levers and open the gate.">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/lvl3.css?v=loading1">
    <link rel="stylesheet" href="../css/helpbox.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>

    <!-- PARTICLE EFFECT CANVAS -->
    <canvas id="spell-particles"></canvas>

    <!-- GATE IMAGE (background is set via CSS, this overlays for transitions) -->
    <div id="gate-image"></div>

    <!-- LEVER HUD — shows which levers are flipped -->
    <div id="lever-hud">
        <div id="lever-hud-label">⚙️ LEVER STATUS</div>
        <div id="lever-slots"></div>
    </div>

    <!-- PROGRESS BAR -->
    <div id="progress-hud">
        <div id="progress-label">🔓 GATE PROGRESS</div>
        <div id="progress-bar-track">
            <div id="progress-bar-fill"></div>
        </div>
        <div id="progress-percent">0%</div>
    </div>

    <!-- THE CAT SPRITE -->
    <div id="the-cat-lvl3"></div>

    <!-- DIALOGUE BOX -->
    <div class="dialogue-box-lvl3" id="dialogue-box">
        <div class="speaker-name-lvl3">The Cat</div>
        <div id="typewriter-text-lvl3"></div>
    </div>

    <!-- GRIMOIRE OVERLAY (Code Editor) -->
    <div id="grimoire-overlay">
        <div id="grimoire-container">
            <div id="grimoire-header">
                <span id="grimoire-title">📜 LEVER CODEX</span>
                <button id="grimoire-close" title="Close Codex">✕</button>
            </div>

            <!-- Current Task Display -->
            <div id="spell-task">
                <span id="spell-task-label">TASK:</span>
                <span id="spell-task-text">Loading...</span>
            </div>

            <!-- Lever Numbers Display -->
            <div id="lever-display">
                <div id="lever-display-label">LEVER NUMBERS:</div>
                <div id="lever-numbers-row"></div>
            </div>

            <!-- Code Editor Area -->
            <div id="code-editor-area">
                <div id="line-numbers"></div>
                <textarea id="code-input" spellcheck="false" autocomplete="off" 
                    placeholder="# Write your Python code here..."></textarea>
            </div>

            <!-- Output Console -->
            <div id="output-console">
                <div id="output-label">>>> OUTPUT</div>
                <div id="output-text"></div>
            </div>

            <!-- Action Buttons -->
            <div id="grimoire-actions">
                <button id="btn-cast-spell">⚡ FLIP LEVER</button>
                <button id="btn-clear">🗑 CLEAR</button>
            </div>
        </div>
    </div>

    <!-- SUCCESS SCREEN -->
    <div id="success-screen">
        <div id="success-content">
            <div id="success-icon">🔓</div>
            <h1 id="success-title">THE GATE IS OPEN!</h1>
            <p id="success-subtitle">Your mastery of odd & even numbers has unlocked the ancient gate.</p>
            <div id="success-stats"></div>
            <button id="btn-continue">CONTINUE THE JOURNEY →</button>
        </div>
    </div>

    <script src="../js/engine.js?v=loading1"></script>
    <script src="../js/helpbox.js"></script>
    <script src="../js/lvl3.js?v=loading1"></script>
    <script>createHelpBox(3);</script>
</body>
</html>
