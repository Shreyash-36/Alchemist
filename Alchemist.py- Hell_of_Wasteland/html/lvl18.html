<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCHEMIST.PY — Level 18: The River of Arrays</title>
    <meta name="description" content="Level 18 of Alchemist.py - Cross the River of Arrays by slicing words to build a path!">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/lvl18.css">
    <link rel="stylesheet" href="../css/helpbox.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>

    <!-- PARTICLE EFFECT CANVAS -->
    <canvas id="spell-particles"></canvas>

    <!-- RIVER BACKGROUNDS (cross-fade on victory) -->
    <div id="room-bg"></div>
    <div id="room-bg-victory"></div>

    <!-- RIVER HUD -->
    <div id="river-hud">
        <div id="river-label">🌊 RIVER OF ARRAYS</div>
        <div id="river-word"></div>
        <div id="river-status">🌊 BLOCKED</div>
    </div>

    <!-- THE CAT SPRITE -->
    <div id="the-cat-lvl18"></div>

    <!-- DIALOGUE BOX -->
    <div class="dialogue-box-lvl18" id="dialogue-box">
        <div class="speaker-name-lvl18">The Cat</div>
        <div id="typewriter-text-lvl18"></div>
    </div>

    <!-- GRIMOIRE OVERLAY (Code Editor) -->
    <div id="grimoire-overlay">
        <div id="grimoire-container">
            <div id="grimoire-header">
                <span id="grimoire-title">🌊 STRING SLICING SPELL</span>
                <button id="grimoire-close" title="Close">✕</button>
            </div>
            <div id="spell-task">
                <span id="spell-task-label">TASK:</span>
                <span id="spell-task-text">Loading...</span>
            </div>
            <div id="code-editor-area">
                <div id="line-numbers"></div>
                <textarea id="code-input" spellcheck="false" autocomplete="off"
                    placeholder="# Write your Python code here..."></textarea>
            </div>
            <div id="output-console">
                <div id="output-label">>>> OUTPUT</div>
                <div id="output-text"></div>
            </div>
            <div id="grimoire-actions">
                <button id="btn-cast-spell">⚡ CAST SLICING SPELL</button>
                <button id="btn-clear">🗑 CLEAR</button>
            </div>
        </div>
    </div>

    <!-- SUCCESS SCREEN -->
    <div id="success-screen">
        <div id="success-content">
            <div id="success-icon">🌊</div>
            <h1 id="success-title">RIVER CROSSED!</h1>
            <p id="success-subtitle">The slicing spell parted the waters and built a path! You crossed the River of Arrays safely!</p>
            <div id="success-stats"></div>
            <button id="btn-continue">CONTINUE THE JOURNEY →</button>
        </div>
    </div>

    <script src="../js/engine.js"></script>
    <script src="../js/helpbox.js"></script>
    <script src="../js/lvl18.js"></script>
    <script>createHelpBox(18);</script>
</body>
</html>
