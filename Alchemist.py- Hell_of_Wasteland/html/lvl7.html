<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALCHEMIST.PY — Level 7: The Reversed Room</title>
    <meta name="description" content="Level 7 of Alchemist.py - A magic spell went wrong! Print numbers in reverse order to fix the upside-down room.">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/lvl7.css?v=loading1">
    <link rel="stylesheet" href="../css/helpbox.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>

    <!-- PARTICLE CANVAS -->
    <canvas id="spell-particles"></canvas>

    <!-- ROOM BACKGROUND (starts upside down) -->
    <div id="room-bg" class="flipped"></div>

    <!-- CHAOS HUD -->
    <div id="chaos-hud">
        <div id="chaos-label">🌀 CHAOS LEVEL</div>
        <div id="chaos-bar-track">
            <div id="chaos-bar-fill"></div>
        </div>
        <div id="chaos-text">FLIPPED!</div>
    </div>

    <!-- THE CAT SPRITE (also upside down!) -->
    <div id="the-cat-lvl7"></div>

    <!-- DIALOGUE BOX -->
    <div class="dialogue-box-lvl7" id="dialogue-box">
        <div class="speaker-name-lvl7">The Cat</div>
        <div id="typewriter-text-lvl7"></div>
    </div>

    <!-- GRIMOIRE OVERLAY (Code Editor) -->
    <div id="grimoire-overlay">
        <div id="grimoire-container">
            <div id="grimoire-header">
                <span id="grimoire-title">📜 REVERSAL SPELL</span>
                <button id="grimoire-close" title="Close">✕</button>
            </div>
            <div id="spell-task">
                <span id="spell-task-label">TASK:</span>
                <span id="spell-task-text">Loading...</span>
            </div>
            <div id="code-editor-area">
                <div id="line-numbers"></div>
                <textarea id="code-input" spellcheck="false" autocomplete="off"
                    placeholder="# Write your Python code here..."></textarea>
            </div>
            <div id="output-console">
                <div id="output-label">>>> OUTPUT</div>
                <div id="output-text"></div>
            </div>
            <div id="grimoire-actions">
                <button id="btn-cast-spell">⚡ CAST REVERSAL</button>
                <button id="btn-clear">🗑 CLEAR</button>
            </div>
        </div>
    </div>

    <!-- SUCCESS SCREEN -->
    <div id="success-screen">
        <div id="success-content">
            <div id="success-icon">✨</div>
            <h1 id="success-title">ORDER IS RESTORED!</h1>
            <p id="success-subtitle">Your reversal spell fixed the room. Everything is right-side up again.</p>
            <div id="success-stats"></div>
            <button id="btn-continue">CONTINUE THE JOURNEY →</button>
        </div>
    </div>

    <script src="../js/engine.js?v=loading1"></script>
    <script src="../js/helpbox.js"></script>
    <script src="../js/lvl7.js?v=loading1"></script>
    <script>createHelpBox(7);</script>
</body>
</html>
